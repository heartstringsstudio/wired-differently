<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* Apply saved theme + font size before first paint to prevent FOUC */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var t = s.getItem('wired_darkMode');
        var dark = t !== null ? JSON.parse(t)
                              : matchMedia('(prefers-color-scheme: dark)').matches;
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        var f = s.getItem('wired_fontSize');
        if (f) d.setAttribute('data-font-size', JSON.parse(f));
      } catch (e) {}
    })();
  </script>
  <title>You're Offline — Wired Differently</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .offline-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: var(--space-xl);
      gap: var(--space-md);
    }
    .offline-icon {
      font-size: 3rem;
      line-height: 1;
    }
    .offline-wrap h1 {
      font-family: var(--font-ui);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
    }
    .offline-wrap p {
      color: var(--color-muted);
      max-width: 40ch;
      margin: 0;
    }
    .offline-wrap a {
      margin-top: var(--space-sm);
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-icon">📵</div>
    <h1>You're offline</h1>
    <p>This page isn't saved yet. Chapters you've already visited are available offline.</p>
    <a href="toc.html" class="btn">Go to table of contents</a>
  </div>
</body>
</html>
