<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    /* The fallback is rendered at the failed request URL. Anchor relative
       links to the service-worker scope so it also works after a repo rename. */
    (function () {
      var base = document.createElement('base');
      var scriptURL = navigator.serviceWorker && navigator.serviceWorker.controller &&
                      navigator.serviceWorker.controller.scriptURL;
      base.href = scriptURL ? new URL('./', scriptURL).href : './';
      document.head.appendChild(base);
    })();
  </script>
  <script>
    /* Apply saved reading settings before first paint to prevent FOUC.
       Keep in sync with Theme and Prefs in js/app.js. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var p = JSON.parse(s.getItem('wired_theme'));
        if (!p) {
          var t = s.getItem('wired_darkMode');
          var dark = t !== null ? JSON.parse(t)
                                : matchMedia('(prefers-color-scheme: dark)').matches;
          p = dark ? 'night' : 'paper';
        }
        d.setAttribute('data-palette', p);
        d.setAttribute('data-theme', p === 'night' || p === 'black' ? 'dark' : 'light');
        ['fontSize:font-size', 'leading:leading', 'margins:margins', 'typeface:typeface']
          .forEach(function (pair) {
            var k = pair.split(':'), v = s.getItem('wired_' + k[0]);
            if (v) d.setAttribute('data-' + k[1], JSON.parse(v));
          });
      } catch (e) {}
    })();
  </script>
  <title>You're Offline — Wired Differently</title>
  <link rel="stylesheet" href="css/style.css?v=21">
  <style>
    .offline-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: var(--space-xl);
      gap: var(--space-md);
    }
    .offline-icon {
      font-size: 3rem;
      line-height: 1;
    }
    .offline-wrap h1 {
      font-family: var(--font-ui);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
    }
    .offline-wrap p {
      color: var(--text-muted);
      max-width: 40ch;
      margin: 0;
    }
    .offline-wrap a {
      margin-top: var(--space-sm);
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-icon">📵</div>
    <h1>You're offline</h1>
    <p>The complete book is saved for offline reading. Return to the contents and choose a chapter.</p>
    <a href="toc.html" class="btn">Go to table of contents</a>
  </div>
</body>
</html>
